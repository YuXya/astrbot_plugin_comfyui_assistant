<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComfyUI 绘图助手</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="layout"><header><div class="brand"><span class="mark">✦</span><div><h1>ComfyUI 绘图助手</h1><p>描述交给 AI，生成与发送交给助手。</p></div></div><button id="refresh" class="secondary">刷新</button></header>
<nav aria-label="管理导航"><button data-tab="workflows" aria-current="page">工作流</button><button data-tab="tasks">任务记录</button><button data-tab="settings">服务设置</button></nav>
<div id="notice" role="status" aria-live="polite"></div><main id="content"><p class="empty">正在连接 AstrBot…</p></main>
<footer id="footer">在 AstrBot Plugin Pages 中管理 · 图片不会自动预览</footer></div>
<dialog id="editor"><form id="workflow-form"><div class="dialog-head"><h2>编辑工作流</h2><button id="close" type="button" aria-label="关闭" class="secondary">关闭</button></div><div id="editor-content"></div><div class="actions"><button type="submit">保存工作流</button></div></form></dialog>
<input type="file" id="upload" accept=".json,application/json" hidden>
<script type="module" src="app.js"></script></body></html>
